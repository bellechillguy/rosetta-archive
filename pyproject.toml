[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-archive"
version = "1.0.0"
description = "Reference implementation of the Rosetta Archive binary format"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rosetta Archive submission"}]

[project.scripts]
rta = "rosetta_archive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
